<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка принята. Мастерская необычных заказов</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4eee4;color:#3a2a20;font:18px/1.6 Roboto,Arial,sans-serif;padding:20px}
.box{max-width:520px;text-align:center}
h1{font:700 clamp(30px,6vw,44px)/1.15 'Playfair Display',Georgia,serif;margin:0 0 .5em}
.btn{display:inline-block;background:#9a4f2a;color:#fff;border-radius:6px;padding:13px 24px;text-decoration:none;font-weight:500;margin-top:12px}
.btn:focus-visible{outline:3px solid #9a4f2a;outline-offset:2px}
</style>
</head>
<body>
<main class="box">
 <h1>Спасибо, заявка принята</h1>
 <p>Мы прочитаем её и свяжемся с вами по тому контакту, который вы оставили.</p>
 <a class="btn" href="/">Вернуться на сайт</a>
</main>
</body>
</html>
